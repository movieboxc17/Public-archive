<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Classic Archive</title>
    <style>
        body {
            background-color: #f4f1e9;
            font-family: "Courier New", Courier, monospace;
            margin: 0;
            padding: 20px;
            color: #2c2c2c;
        }

        .archive-container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #ccc;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
            padding: 20px;
        }

        header {
            text-align: center;
            border-bottom: 2px double #666;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.5em;
            margin: 0;
            color: #4a4a4a;
        }

        .archive-date {
            font-style: italic;
            color: #666;
            margin-top: 10px;
        }

        .archive-nav {
            text-align: center;
            margin: 20px 0;
            padding: 10px;
            background: #eee;
        }

        .archive-nav a {
            color: #444;
            text-decoration: none;
            padding: 5px 15px;
            margin: 0 10px;
            border: 1px solid transparent;
        }

        .archive-nav a:hover,
        .archive-nav a.active {
            border: 1px solid #666;
            background: #fff;
        }

        .archive-content {
            padding: 20px;
        }

        .archive-entry {
            margin-bottom: 30px;
        }

        .archive-entry h2 {
            color: #444;
            border-bottom: 1px solid #ccc;
            padding-bottom: 5px;
        }

        .archive-entry ul {
            list-style-type: none;
            padding: 0;
        }

        .archive-entry li {
            margin: 10px 0;
            padding: 5px;
            border-bottom: 1px dotted #ddd;
        }

        .date {
            color: #666;
            margin-right: 15px;
            font-size: 0.9em;
        }

        .archive-entry a {
            color: #2c2c2c;
            text-decoration: none;
        }

        .archive-entry a:hover {
            text-decoration: underline;
            color: #666;
        }

        .add-entry-form {
            margin-top: 40px;
            padding: 20px;
            background: #f9f9f9;
            border: 1px solid #ddd;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 8px;
            font-family: inherit;
            border: 1px solid #ccc;
        }

        button {
            background: #4a4a4a;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-family: inherit;
        }

        button:hover {
            background: #666;
        }
    </style>
</head>
<body>
    <div class="archive-container">
        <header>
            <h1>📚 The Classic Archive</h1>
            <div class="archive-date">Est. 2024</div>
        </header>
        
        <nav class="archive-nav">
            <a href="#" class="active">Home</a>
            <a href="#">Documents</a>
            <a href="#">Collections</a>
            <a href="#">About</a>
        </nav>

        <div class="archive-content">
            <div class="archive-entry">
                <h2>Latest Additions</h2>
                <ul>
                    <li>
                        <span class="date">2024-01-20</span>
                        <a href="#">Ancient Manuscripts Collection</a>
                    </li>
                    <li>
                        <span class="date">2024-01-19</span>
                        <a href="#">Historical Documents</a>
                    </li>
                    <li>
                        <span class="date">2024-01-18</span>
                        <a href="#">Vintage Photographs</a>
                    </li>
                </ul>
            </div>

            <div class="add-entry-form">
                <h2>Add New Entry</h2>
                <form id="newEntryForm">
                    <div class="form-group">
                        <label for="entryTitle">Title:</label>
                        <input type="text" id="entryTitle" required>
                    </div>
                    <div class="form-group">
                        <label for="entryDate">Date:</label>
                        <input type="date" id="entryDate" required>
                    </div>
                    <button type="submit">Add Entry</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('newEntryForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const title = document.getElementById('entryTitle').value;
            const date = document.getElementById('entryDate').value;
            
            const newEntry = document.createElement('li');
            newEntry.innerHTML = `
                <span class="date">${date}</span>
                <a href="#">${title}</a>
            `;
            
            document.querySelector('.archive-entry ul').insertBefore(newEntry, document.querySelector('.archive-entry ul').firstChild);
            
            document.getElementById('entryTitle').value = '';
            document.getElementById('entryDate').value = '';
        });
    </script>
</body>
</html>
