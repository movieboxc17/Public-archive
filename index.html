<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historical Archive Database</title>
    <style>
        body {
            background-color: #f4f1e9;
            font-family: "Courier New", Courier, monospace;
            margin: 0;
            padding: 20px;
            color: #2c2c2c;
        }

        .archive-container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #ccc;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
            padding: 20px;
        }

        .auth-forms {
            max-width: 400px;
            margin: 20px auto;
            padding: 20px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .auth-form {
            padding: 20px;
        }

        .auth-form h3 {
            margin-top: 0;
            color: #4a4a4a;
            text-align: center;
        }

        .auth-form input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .auth-form button {
            width: 100%;
            margin-top: 10px;
            background: #4a4a4a;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        .auth-form button:hover {
            background: #666;
        }

        .auth-form p {
            text-align: center;
            margin-top: 15px;
        }

        .auth-form a {
            color: #4a4a4a;
            text-decoration: underline;
            cursor: pointer;
        }

        header {
            text-align: center;
            border-bottom: 2px double #666;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.5em;
            margin: 0;
            color: #4a4a4a;
        }

        .archive-date {
            font-style: italic;
            color: #666;
            margin-top: 10px;
        }

        .archive-nav {
            text-align: center;
            margin: 20px 0;
            padding: 10px;
            background: #eee;
        }

        .archive-nav a {
            color: #444;
            text-decoration: none;
            padding: 5px 15px;
            margin: 0 10px;
            border: 1px solid transparent;
        }

        .archive-nav a:hover,
        .archive-nav a.active {
            border: 1px solid #666;
            background: #fff;
        }

        .archive-content {
            padding: 20px;
        }

        .archive-entry {
            margin-bottom: 30px;
        }

        .archive-entry h2 {
            color: #444;
            border-bottom: 1px solid #ccc;
            padding-bottom: 5px;
        }

        .archive-entry ul {
            list-style-type: none;
            padding: 0;
        }

        .archive-entry li {
            margin: 10px 0;
            padding: 15px;
            border-bottom: 1px dotted #ddd;
            background: #fafafa;
        }

        .date {
            color: #666;
            margin-right: 15px;
            font-size: 0.9em;
        }

        .category-tag {
            background: #e0e0e0;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            margin-left: 10px;
        }

        .add-entry-form {
            margin-top: 40px;
            padding: 20px;
            background: #f9f9f9;
            border: 1px solid #ddd;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .form-group textarea {
            height: 100px;
            resize: vertical;
        }

        .user-info {
            text-align: right;
            padding: 10px;
            color: #666;
        }

        #logoutBtn {
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="archive-container">
        <div class="user-info">
            <span id="userEmail"></span>
            <button id="logoutBtn" style="display: none;">Logout</button>
        </div>

        <header>
            <h1>📚 Historical Archive Database</h1>
            <div class="archive-date">National Archives Collection</div>
        </header>

        <!-- Auth Forms -->
        <div class="auth-forms" id="authForms">
            <div class="auth-form" id="loginForm">
                <h3>Login to Archive</h3>
                <form id="emailLoginForm">
                    <div class="form-group">
                        <label for="loginEmail">Email:</label>
                        <input type="email" id="loginEmail" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Password:</label>
                        <input type="password" id="loginPassword" required>
                    </div>
                    <button type="submit">Login</button>
                </form>
                <p>Don't have an account? <a id="showSignup">Sign up</a></p>
            </div>

            <div class="auth-form" id="signupForm" style="display: none;">
                <h3>Create Account</h3>
                <form id="emailSignupForm">
                    <div class="form-group">
                        <label for="signupEmail">Email:</label>
                        <input type="email" id="signupEmail" required>
                    </div>
                    <div class="form-group">
                        <label for="signupPassword">Password:</label>
                        <input type="password" id="signupPassword" required>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password:</label>
                        <input type="password" id="confirmPassword" required>
                    </div>
                    <button type="submit">Sign Up</button>
                </form>
                <p>Already have an account? <a id="showLogin">Login</a></p>
            </div>
        </div>

        <!-- Main Archive Content -->
        <div id="mainContent" style="display: none;">
            <nav class="archive-nav">
                <a href="#" class="active">Home</a>
                <a href="#">Medieval Documents</a>
                <a href="#">War Records</a>
                <a href="#">Cultural Heritage</a>
                <a href="#">Scientific Papers</a>
            </nav>

            <div class="archive-content">
                <div class="archive-entry">
                    <h2>Historical Records</h2>
                    <ul id="archiveList"></ul>
                </div>

                <div class="add-entry-form">
                    <h2>Add Historical Document</h2>
                    <form id="newEntryForm">
                        <div class="form-group">
                            <label for="entryTitle">Document Title:</label>
                            <input type="text" id="entryTitle" required>
                        </div>
                        <div class="form-group">
                            <label for="entryDate">Original Date:</label>
                            <input type="date" id="entryDate" required>
                        </div>
                        <div class="form-group">
                            <label for="category">Category:</label>
                            <select id="category" required>
                                <option value="medieval">Medieval Documents</option>
                                <option value="war">War Records</option>
                                <option value="cultural">Cultural Heritage</option>
                                <option value="scientific">Scientific Papers</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="description">Description:</label>
                            <textarea id="description" required></textarea>
                        </div>
                        <div class="form-group">
                            <label for="document">Upload Document:</label>
                            <input type="file" id="document" accept=".pdf,.jpg,.png,.doc,.docx">
                        </div>
                        <button type="submit">Add to Archive</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-analytics.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBwjmfqvb4-y1cos7DCSIbolFc_wO5lPs8",
            authDomain: "public-archive-33322.firebaseapp.com",
            projectId: "public-archive-33322",
            storageBucket: "public-archive-33322.firebasestorage.app",
            messagingSenderId: "743815264630",
            appId: "1:743815264630:web:9c28fb4049529626d56257",
            measurementId: "G-RWLTHTTB07"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // Auth state handling
        auth.onAuthStateChanged(user => {
            const authForms = document.getElementById('authForms');
            const mainContent = document.getElementById('mainContent');
            const userEmail = document.getElementById('userEmail');
            const logoutBtn = document.getElementById('logoutBtn');

            if (user) {
                authForms.style.display = 'none';
                mainContent.style.display = 'block';
                userEmail.textContent = user.email;
                logoutBtn.style.display = 'inline-block';
            } else {
                authForms.style.display = 'block';
                mainContent.style.display = 'none';
                userEmail.textContent = '';
                logoutBtn.style.display = 'none';
            }
        });

        // Form switching
        document.getElementById('showSignup').addEventListener('click', () => {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('signupForm').style.display = 'block';
        });

        document.getElementById('showLogin').addEventListener('click', () => {
            document.getElementById('signupForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
        });

        // Login
        document.getElementById('emailLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                e.target.reset();
            } catch (error) {
                alert('Login failed: ' + error.message);
            }
        });

        // Signup
        document.getElementById('emailSignupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }

            try {
                await createUserWithEmailAndPassword(auth, email, password);
                e.target.reset();
            } catch (error) {
                alert('Signup failed: ' + error.message);
            }
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try {
                await signOut(auth);
            } catch (error) {
                alert('Logout failed: ' + error.message);
            }
        });

        // Real-time updates for archive entries
        const q = query(collection(db, 'archives'), orderBy('timestamp', 'desc'));
        onSnapshot(q, (snapshot) => {
            const archiveList = document.getElementById('archiveList');
            archiveList.innerHTML = '';
            
            snapshot.forEach((doc) => {
                const data = doc.data();
                const li = document.createElement('li');
                li.innerHTML = `
                    <span class="date">${data.date}</span>
                    <a href="${data.fileUrl || '#'}" target="_blank">${data.title}</a>
                    <span class="category-tag">${data.category}</span>
                    <div class="metadata">${data.description}</div>
                `;
                archiveList.appendChild(li);
            });
        });

        // New entry form handling
        document.getElementById('newEntryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const title = document.getElementById('entryTitle').value;
            const date = document.getElementById('entryDate').value;
            const category = document.getElementById('category').value;
            const description = document.getElementById('description').value;
            const file = document.getElementById('document').files[0];

            try {
                let fileUrl = null;
                if (file) {
                    const storageRef = ref(storage, `documents/${Date.now()}-${file.name}`);
                    await uploadBytes(storageRef, file);
                    fileUrl = await getDownloadURL(storageRef);
                }

                await addDoc(collection(db, 'archives'), {
                    title,
                    date,
                    category,
                    description,
                    fileUrl,
                    timestamp: serverTimestamp(),
                    userId: auth.currentUser.uid,
                    userEmail: auth.currentUser.email
                });

                e.target.reset();
                alert('Document successfully added to archive!');
            } catch (error) {
                alert('Error adding document: ' + error.message);
            }
        });
    </script>
</body>
</html>
